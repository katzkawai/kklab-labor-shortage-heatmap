name: Update labor data

on:
  schedule:
    # 毎月2日 10:23 JST（= 01:23 UTC）。前月分の報道発表（月末公表）を取り込む
    - cron: "23 1 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run updater
        id: updater
        run: python3 scripts/update_data.py

      - name: Commit and push
        if: steps.updater.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Add monthly labor data (${{ steps.updater.outputs.month }})"
          git push
